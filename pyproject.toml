[project]
name = "openwall-stud-frame"
version = "0.0.0"
description = "Residential framing point-cloud scaffold. Dependencies match requirements.txt."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "open3d==0.20.0",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "tzdata",
  "pyransac3d==0.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["open3d_smoke"]

[tool.setuptools.package-dir]
"" = "src"
